<button id="getDataButton">get data</button>
<pre id="output"></pre>
<button id="getResultsButton">get results</button>
<pre id="output"></pre>

<script>
    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(";").shift();
    }

document.getElementById("getDataButton").addEventListener("click", async () => {
    const out = document.getElementById("output");
    out.textContent = "Running...";

    try {
        const response = await fetch("{% url 'get-races' %}", {
            method: "POST",
            headers: { "X-CSRFToken": getCookie("csrftoken") },
        });

        if (response.status === 401) {
            out.textContent = "You are not logged in.";
            return;
        }
        if (response.status === 403) {
            out.textContent = "You don't have permission to do this.";
            return;
        }

        const data = await response.json();
        out.textContent = data.ok ? data.output : "Error: " + data.error;
    } catch (err) {
        out.textContent = "Request failed: " + err.message;
    }
});
</script>
